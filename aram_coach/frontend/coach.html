<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 乱斗导师 · 实时卡片</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    background: #0a0f1a;
    color: #c8d6e5;
    font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    padding: 24px;
}
.container { max-width: 560px; margin: 0 auto; }
.header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #1e2d3d;
}
.header h1 { font-size: 18px; color: #43cea2; }
.header .refresh {
    background: linear-gradient(135deg, #43cea2, #185a9d);
    border: none; color: white; border-radius: 20px;
    padding: 6px 16px; font-size: 12px; cursor: pointer;
}
.header .refresh:hover { filter: brightness(1.2); }
.header .auto-refresh {
    font-size: 11px; color: #8899aa; margin-top: 4px;
}
.loading {
    text-align: center; padding: 40px; color: #8899aa;
    font-size: 14px;
}
.error {
    text-align: center; padding: 40px; color: #ef5350;
    font-size: 14px;
}

.quick-card {
    background: #0f1923;
    border-radius: 16px;
    border: 1px solid #1e2d3d;
    overflow: hidden;
}
.card-top {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; font-size: 13px; color: #8899aa;
    border-bottom: 1px solid #1e2d3d;
}
.card-top .gold { color: #ffd54f; font-weight: 700; }
.card-top .level { color: #bb86fc; font-weight: 700; }

.situation {
    padding: 20px; text-align: center; color: white;
}
.situation .label { font-size: 13px; opacity: 0.9; }
.situation .action {
    font-size: 26px; font-weight: 800; margin: 6px 0; letter-spacing: 1px;
}
.situation .vs { font-size: 13px; opacity: 0.9; }

.section {
    padding: 14px 16px; border-bottom: 1px solid #1e2d3d;
}
.section:last-child { border-bottom: none; }
.section-title {
    font-size: 11px; color: #8899aa; margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: 0.5px;
}

.next-item {
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 12px; padding: 16px; color: white; text-align: center;
}
.next-item .item-name { font-size: 24px; font-weight: 800; margin: 4px 0; }
.next-item .item-detail { font-size: 13px; opacity: 0.9; }
.next-item .item-cost { font-size: 12px; opacity: 0.8; margin-top: 4px; }

.threats { display: flex; flex-wrap: wrap; gap: 6px; }
.threat-chip {
    background: rgba(239,83,80,0.15);
    border: 1px solid rgba(239,83,80,0.5);
    border-radius: 8px; padding: 6px 12px; font-size: 13px;
    color: #ff8a80; font-weight: 600;
}
.threat-chip.dead {
    background: rgba(136,153,170,0.1);
    border-color: rgba(136,153,170,0.3);
    color: #8899aa;
}
.threat-chip .respawn { font-size: 10px; margin-left: 4px; opacity: 0.7; }

.tips { }
.tip-item {
    background: rgba(67,206,162,0.08);
    border-radius: 8px; padding: 10px 12px;
    font-size: 13px; color: #c8d6e5; margin-bottom: 6px;
    border-left: 3px solid #43cea2;
}
.tip-item:last-child { margin-bottom: 0; }

.stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
}
.stat-box {
    background: #1e2d3d; border-radius: 10px; padding: 12px; text-align: center;
}
.stat-box .stat-label { font-size: 10px; color: #8899aa; margin-bottom: 4px; }
.stat-box .stat-val { font-size: 18px; font-weight: 800; }
.stat-box.ap .stat-val { color: #bb86fc; }
.stat-box.haste .stat-val { color: #43cea2; }
.stat-box.gold .stat-val { color: #ffd54f; }

.items-row {
    display: flex; flex-wrap: wrap; gap: 6px;
}
.item-chip {
    background: #1e2d3d; border-radius: 6px; padding: 4px 10px;
    font-size: 12px; color: #c8d6e5; border: 1px solid #2d4a5a;
}

.kda-row {
    display: flex; gap: 8px; font-size: 13px; color: #c8d6e5;
}
.kda-row .k { color: #43cea2; font-weight: 700; }
.kda-row .d { color: #ef5350; font-weight: 700; }
.kda-row .a { color: #ffd54f; font-weight: 700; }

.team-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: #8899aa; margin-top: 8px;
}
.team-row .me { color: #43cea2; font-weight: 600; }
.team-row .enemy { color: #ef5350; }

.timestamp {
    text-align: center; font-size: 10px; color: #566573;
    margin-top: 16px;
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1>🎮 乱斗导师 · 实时卡片</h1>
            <div class="auto-refresh">⚡ 自动 2 秒刷新</div>
        </div>
        <button class="refresh" onclick="loadCard()">🔄 刷新</button>
    </div>

    <div id="cardArea">
        <div class="loading">加载中...</div>
    </div>

    <div class="timestamp" id="ts"></div>
</div>

<script>
async function loadCard() {
    const area = document.getElementById('cardArea');
    try {
        const resp = await fetch('/api/coach/quick?t=' + Date.now());
        if (resp.ok) {
            const html = await resp.text();
            area.innerHTML = html;
            document.getElementById('ts').textContent = '⏱️ ' + new Date().toLocaleTimeString();
        } else {
            area.innerHTML = '<div class="error">❌ 加载失败 ' + resp.status + '</div>';
        }
    } catch (e) {
        area.innerHTML = '<div class="error">❌ ' + e.message + '</div>';
    }
}

loadCard();
setInterval(loadCard, 2000);
</script>
</body>
</html>
