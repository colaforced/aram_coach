<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 乱斗导师 · 实时卡片</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    background: #0a0f1a;
    color: #c8d6e5;
    font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
}
body { padding: 24px; }
.container { max-width: 560px; margin: 0 auto; }
.header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #1e2d3d;
}
.header h1 { font-size: 18px; color: #43cea2; }
.header .sub { font-size: 11px; color: #8899aa; margin-top: 4px; }
.facts { display: flex; gap: 14px; font-size: 13px; color: #8899aa; margin-bottom: 12px; flex-wrap: wrap; }
.facts b { color: #eceff1; font-variant-numeric: tabular-nums; }
.facts .gold b { color: #ffd54f; }
.deep-btn {
    display: block; width: 100%; margin-top: 20px; text-align: center;
    background: linear-gradient(135deg, #a855f7, #ec4899);
    color: white; border-radius: 12px; padding: 12px 16px; font-size: 14px; font-weight: 700; text-decoration: none;
}
.deep-btn:hover { filter: brightness(1.15); }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1>🎮 乱斗导师 · 实时卡片</h1>
            <div class="sub" id="conn">连接中…</div>
        </div>
    </div>
    <div class="facts" id="facts"></div>
    <div id="cardArea"></div>
    <a class="deep-btn" href="/deep">🔍 打开深度分析报告 →</a>
</div>

<script src="/static/coach-card.js"></script>
<script>
const IN_GAME = ['GameStart', 'InProgress', 'Reconnect'];

// 只放屏幕上一眼要看的事实，建议都在决策卡里
function facts(s) {
    const lcd = s.lcd || {};
    if (!IN_GAME.includes(s.phase) || !lcd.available) return '';
    const a = lcd.active || {};
    const t = lcd.game_time || 0;
    const teams = lcd.team_map || {};
    const iAmChaos = (teams.CHAOS || []).some(p => p.is_me);
    const mine = (iAmChaos ? teams.CHAOS : teams.ORDER) || [];
    const theirs = (iAmChaos ? teams.ORDER : teams.CHAOS) || [];
    const alive = list => list.filter(p => !p.is_dead).length;
    const me = mine.find(p => p.is_me) || {};
    return `<span>⏱️ <b>${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}</b></span>
        <span>Lv <b>${Number(a.level) || '?'}</b></span>
        <span class="gold">💰 <b>${Math.round(a.gold || 0)}G</b></span>
        <span>KDA <b>${Number(me.kills) || 0}/${Number(me.deaths) || 0}/${Number(me.assists) || 0}</b></span>
        <span>存活 <b>${alive(mine)} : ${alive(theirs)}</b></span>`;
}

function show(s) {
    document.getElementById('facts').innerHTML = facts(s);
    document.getElementById('cardArea').innerHTML = CoachCard.render(s);
    AugmentPicker.showLauncher(s.lcu_connected && IN_GAME.includes(s.phase));
}

function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${proto}//${location.host}/ws`);
    const conn = document.getElementById('conn');
    ws.onopen = () => { conn.textContent = '⚡ 实时推送'; };
    ws.onmessage = ev => {
        const msg = JSON.parse(ev.data);
        if (['initial', 'state_update', 'phase_change'].includes(msg.type)) show(msg.data);
        else if (msg.type === 'level_up' && msg.data.augment) {
            CoachCard.toast(`Lv.${msg.data.new_level}：强化符文三选一，把看到的三个选项填进右下角`);
            AugmentPicker.open();
        }
    };
    ws.onclose = () => { conn.textContent = '连接断开，重连中…'; setTimeout(connect, 2000); };
}
show({});
connect();
</script>
</body>
</html>
