<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 乱斗深度分析</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    background: #0a0f1a;
    color: #c8d6e5;
    font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    padding: 24px;
}
.container { max-width: 720px; margin: 0 auto; }

.top-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid #1e2d3d;
}
.top-bar h1 { font-size: 20px; color: #a855f7; }
.top-bar .actions { display: flex; gap: 8px; }

.btn {
    border: none; color: white; border-radius: 20px;
    padding: 8px 18px; font-size: 13px; cursor: pointer; font-weight: 600;
}
.btn-back {
    background: linear-gradient(135deg, #43cea2, #185a9d);
}
.btn-back:hover { filter: brightness(1.15); }
.btn-refresh {
    background: linear-gradient(135deg, #a855f7, #ec4899);
}
.btn-refresh:hover { filter: brightness(1.15); }
.btn-refresh:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-refresh .spinner {
    display: none; width: 12px; height: 12px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white; border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 4px;
}
.btn-refresh.loading .spinner { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

.meta {
    font-size: 11px; color: #566573;
    text-align: center; margin-bottom: 16px;
}

.report {
    background: #0f1923;
    border: 1px solid #1e2d3d;
    border-radius: 16px;
    overflow: hidden;
}
.report-head {
    background: linear-gradient(135deg, #1e2d3d, #0f1923);
    padding: 14px 20px;
    border-bottom: 1px solid #2d4a5a;
    font-size: 14px; color: #a855f7; font-weight: 700;
    display: flex; justify-content: space-between; align-items: center;
}
.report-head .tag {
    font-size: 10px; background: rgba(168,85,247,0.2);
    padding: 3px 8px; border-radius: 10px; color: #a855f7;
}
.report-body {
    padding: 24px 28px;
    font-size: 14px; line-height: 2;
    white-space: pre-wrap;
}

.loading-box {
    text-align: center; padding: 60px 20px; color: #8899aa;
}
.loading-box .big-spinner {
    width: 40px; height: 40px; margin: 0 auto 16px;
    border: 3px solid #1e2d3d; border-top-color: #a855f7;
    border-radius: 50%; animation: spin 1s linear infinite;
}

.error-box {
    text-align: center; padding: 40px; color: #ef5350;
    font-size: 14px;
}
</style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <h1>📊 乱斗深度分析报告</h1>
        <div class="actions">
            <button class="btn btn-refresh" id="refreshBtn" onclick="loadDeep()">
                <span class="spinner"></span>🔄 重新分析
            </button>
            <button class="btn btn-back" onclick="location.href='/coach'">← 返回卡片</button>
        </div>
    </div>

    <div class="meta" id="meta">正在加载...</div>

    <div class="report">
        <div class="report-head">
            <span>深度分析</span>
            <span class="tag" id="modeTag">⚡ 本地规则引擎</span>
        </div>
        <div class="report-body" id="body">
            <div class="loading-box">
                <div class="big-spinner"></div>
                <div>正在结合知识库分析对局数据...</div>
            </div>
        </div>
    </div>
</div>

<script>
async function loadDeep() {
    const btn = document.getElementById('refreshBtn');
    const body = document.getElementById('body');
    const meta = document.getElementById('meta');

    btn.classList.add('loading');
    btn.disabled = true;
    body.innerHTML = '<div class="loading-box"><div class="big-spinner"></div><div>正在结合知识库分析对局数据...</div></div>';
    meta.textContent = '分析中...';

    try {
        const resp = await fetch('/api/coach/deep?t=' + Date.now());
        if (!resp.ok) {
            body.innerHTML = '<div class="error-box">❌ 请求失败 ' + resp.status + '</div>';
            return;
        }
        const data = await resp.json();
        if (data.error) {
            body.innerHTML = '<div class="error-box">❌ ' + data.error + '</div>';
            return;
        }
        body.textContent = data.analysis || '（无分析内容）';
        const tag = document.getElementById('modeTag');
        if (data.mode === 'llm') {
            tag.textContent = '🤖 LLM ' + (data.model || '');
        } else {
            tag.textContent = '⚡ 本地规则引擎';
        }
        meta.textContent = '⏱️ ' + new Date().toLocaleTimeString();
    } catch (e) {
        body.innerHTML = '<div class="error-box">❌ ' + e.message + '</div>';
    } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
    }
}

loadDeep();
</script>
</body>
</html>
