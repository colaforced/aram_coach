<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ARAM Coach - 大乱斗实时指导</title>
<link rel="icon" href="data:,">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0a0e17;
    color: #e0e6ed;
    min-height: 100vh;
    padding: 20px;
}
.container {
    max-width: 1880px;
    margin: 0 auto;
}
/* 一页仪表盘：宽屏三列（决策 / 战况 / 指导），中屏两列，窄屏一列 */
.dash {
    display: grid;
    gap: 16px;
    align-items: start;
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "main" "team" "guide";
}
.dash[hidden] { display: none; }
.dash-main { grid-area: main; }
.dash-team { grid-area: team; }
.dash-guide { grid-area: guide; }
@media (min-width: 1100px) {
    .dash { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "main guide" "team guide"; }
}
@media (min-width: 1600px) {
    .dash { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "main team guide"; }
}
/* 右列：英雄指导 / 深度分析 / 问 AI 三个页签。页签内容不随 2 秒推送重绘，报告和输入框不会被清掉 */
.guide-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.guide-tabs button {
    flex: 1; background: #141c28; color: #90a4ae; border: 1px solid #2a3142; border-radius: 8px;
    padding: 8px 10px; font-size: 13px; font-weight: 600; cursor: pointer;
}
.guide-tabs button.on { background: #1e2a3a; color: #4fc3f7; border-color: #4fc3f7; }
.guide-pane[hidden] { display: none; }
.guide-pane .ai-answer { max-height: 70vh; overflow-y: auto; }
.ai-thread { max-height: 62vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.ai-thread:empty { display: none; }
.ai-thread .ai-answer { max-height: none; overflow: visible; }
.ai-q { font-size: 13px; color: #90caf9; margin-bottom: 6px; }
.ai-thinking { color: #90a4ae; }
.ai-thread-tools { text-align: right; margin-top: 6px; }
.ai-thread-tools button { background: none; border: none; color: #607d8b; font-size: 12px; cursor: pointer; }
.ai-thread-tools button:hover { color: #b0bec5; }
.guide-pane .ai-input-row { padding: 12px 0 0; background: none; border-top: none; }
.deep-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 12px; color: #78909c; }
.deep-head button {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; border-radius: 8px;
    padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
}
.deep-head button:disabled { opacity: 0.5; cursor: not-allowed; }
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: linear-gradient(135deg, #1a1f2e, #0f1420);
    border: 1px solid #2a3142;
    border-radius: 12px;
    margin-bottom: 20px;
}
.header { flex-wrap: wrap; gap: 12px; }
.header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.header-nav { display: flex; gap: 8px; }
.header-nav button {
    background: #1e2a3a; color: #cfd8dc; border: 1px solid #2d3f55; border-radius: 8px;
    padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
}
.header-nav button:hover { border-color: #4fc3f7; color: #4fc3f7; }
.header h1 {
    font-size: 20px;
    font-weight: 600;
    color: #4fc3f7;
    letter-spacing: 0.5px;
}
.status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
}
.status-pill .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
}
.status-connected {
    background: rgba(76, 175, 80, 0.15);
    color: #81c784;
    border: 1px solid rgba(76, 175, 80, 0.3);
}
.status-connected .dot { background: #4caf50; animation: pulse 2s infinite; }
.status-waiting {
    background: rgba(255, 193, 7, 0.1);
    color: #ffb74d;
    border: 1px solid rgba(255, 193, 7, 0.3);
}
.status-waiting .dot { background: #ffb74d; }
.status-disconnected {
    background: rgba(244, 67, 54, 0.1);
    color: #ef5350;
    border: 1px solid rgba(244, 67, 54, 0.3);
}
.status-disconnected .dot { background: #f44336; }
@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

.phase-badge {
    padding: 4px 12px;
    background: rgba(79, 195, 247, 0.1);
    border: 1px solid rgba(79, 195, 247, 0.3);
    color: #4fc3f7;
    border-radius: 6px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.panel {
    background: linear-gradient(135deg, #1a1f2e, #0f1420);
    border: 1px solid #2a3142;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
}
.panel h2 {
    font-size: 15px;
    color: #90a4ae;
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 600;
}

.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #607d8b;
}
.empty-state .icon {
    font-size: 48px;
    margin-bottom: 16px;
}
.empty-state p {
    font-size: 14px;
    line-height: 1.8;
}

.champion-card {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid #2a3142;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 12px;
}
.champion-card:last-child { margin-bottom: 0; }
.champion-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid #2a3142;
}
.champion-name {
    font-size: 18px;
    font-weight: 700;
    color: #4fc3f7;
}
.champion-role {
    padding: 2px 10px;
    background: rgba(79, 195, 247, 0.15);
    border: 1px solid rgba(79, 195, 247, 0.25);
    color: #4fc3f7;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
}
.champion-header.my-card .champion-name { color: #66bb6a; }
.champion-header.my-card .champion-role {
    background: rgba(102, 187, 106, 0.15);
    border-color: rgba(102, 187, 106, 0.25);
    color: #81c784;
}

.section { margin-bottom: 14px; }
.section:last-child { margin-bottom: 0; }
.section-title {
    font-size: 12px;
    color: #78909c;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    font-weight: 600;
}

.rune-box {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid #3a4558;
    border-radius: 6px;
    font-size: 13px;
}
.rune-primary { border-color: #ff9800; color: #ffb74d; }
.rune-secondary { border-color: #9c27b0; color: #ba68c8; }

.rune-details {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
}
.rune-chip {
    padding: 3px 10px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 4px;
    font-size: 12px;
    color: #cfd8dc;
}

.build-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
}
.build-item {
    padding: 8px 14px;
    background: linear-gradient(135deg, #2a3142, #1e2432);
    border: 1px solid #3a4558;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
}
.build-arrow {
    color: #546e7a;
    font-size: 14px;
}

.situational-item {
    padding: 8px 12px;
    background: rgba(255, 193, 7, 0.05);
    border-left: 3px solid #ffb74d;
    border-radius: 0 4px 4px 0;
    margin-bottom: 6px;
    font-size: 13px;
}
.situational-item:last-child { margin-bottom: 0; }
.situational-item strong {
    color: #ffb74d;
    font-size: 12px;
    margin-right: 6px;
}

.tips-list { list-style: none; }
.tips-list li {
    position: relative;
    padding: 6px 0 6px 18px;
    font-size: 13px;
    color: #b0bec5;
    line-height: 1.5;
}
.tips-list li::before {
    content: '•';
    position: absolute;
    left: 0;
    color: #4fc3f7;
    font-weight: bold;
}

.special-tips {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}
.special-tip {
    padding: 12px;
    background: rgba(79, 195, 247, 0.05);
    border: 1px solid rgba(79, 195, 247, 0.2);
    border-radius: 8px;
}
.special-tip-title {
    font-size: 11px;
    color: #4fc3f7;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
    margin-bottom: 4px;
}
.special-tip-content {
    font-size: 12px;
    color: #b0bec5;
    line-height: 1.5;
}

.team-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}
.team-card {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid #2a3142;
    border-radius: 10px;
    padding: 14px;
}
.team-title {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid #2a3142;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.team-ally .team-title { color: #81c784; border-color: rgba(102, 187, 106, 0.3); }
.team-enemy .team-title { color: #ef5350; border-color: rgba(244, 67, 54, 0.3); }
.team-role {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 13px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
}
.team-role:last-child { border-bottom: none; }
.team-role .role-name { color: #78909c; }
.team-role .role-count { color: #cfd8dc; font-weight: 600; }

.balance-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.balance-even { background: rgba(76,175,80,0.15); color: #81c784; }
.balance-minus { background: rgba(244,67,54,0.15); color: #ef5350; }
.balance-plus { background: rgba(255,193,7,0.15); color: #ffb74d; }


.role-bar {
    display: flex;
    gap: 4px;
    margin-top: 4px;
}
.role-dot {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    font-size: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #0a0e17;
}
.role-tank { background: #ff9800; }
.role-mage { background: #9c27b0; }
.role-marksman { background: #f44336; }
.role-assassin { background: #e91e63; }
.role-fighter { background: #4caf50; }
.role-support { background: #2196f3; }

.reroll-card {
    background: linear-gradient(135deg, #2a1f2e, #1a1420);
    border: 2px solid #ffb74d;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
}
.reroll-card.decision-reroll { border-color: #ef5350; background: linear-gradient(135deg, #2e1a1a, #201010); }
.reroll-card.decision-keep { border-color: #66bb6a; background: linear-gradient(135deg, #1a2e1a, #102010); }
.reroll-card.decision-consider { border-color: #ffb74d; background: linear-gradient(135deg, #2e2a1a, #201e10); }

.reroll-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}
.reroll-emoji { font-size: 32px; }
.reroll-title { font-size: 18px; font-weight: 700; }
.reroll-decision-reroll .reroll-title { color: #ef5350; }
.reroll-decision-keep .reroll-title { color: #66bb6a; }
.reroll-decision-consider .reroll-title { color: #ffb74d; }
.reroll-dice {
    margin-left: auto;
    display: flex;
    gap: 4px;
}
.reroll-dice .dice {
    width: 28px; height: 28px;
    border-radius: 6px;
    background: #3a4558;
    border: 1px solid #546e7a;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
    color: #78909c;
}
.reroll-dice .dice.available {
    background: linear-gradient(135deg, #ffb74d, #ff9800);
    border-color: #ff9800;
    color: #fff;
    box-shadow: 0 0 8px rgba(255,183,77,0.4);
}

.reroll-scores {
    display: flex;
    gap: 20px;
    margin-bottom: 12px;
}
.reroll-score-item {
    flex: 1;
    text-align: center;
    padding: 10px;
    background: rgba(255,255,255,0.03);
    border-radius: 8px;
}
.reroll-score-value {
    font-size: 24px;
    font-weight: 700;
}
.reroll-score-label {
    font-size: 11px;
    color: #78909c;
    margin-top: 2px;
}
.score-high { color: #66bb6a; }
.score-mid { color: #ffb74d; }
.score-low { color: #ef5350; }

.reroll-reason {
    font-size: 14px;
    color: #cfd8dc;
    margin-bottom: 10px;
    font-weight: 500;
}
.reroll-suggestions {
    list-style: none;
}
.reroll-suggestions li {
    font-size: 12px;
    color: #90a4ae;
    padding: 3px 0 3px 14px;
    position: relative;
}
.reroll-suggestions li::before {
    content: '▸';
    position: absolute;
    left: 0;
    color: #ffb74d;
}

.live-status-bar {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 14px 18px;
    background: linear-gradient(135deg, #1a2a1f, #101815);
    border: 2px solid #66bb6a;
    border-radius: 12px;
    margin-bottom: 14px;
}
.live-stat {
    text-align: center;
    min-width: 70px;
}
.live-stat-value {
    font-size: 22px;
    font-weight: 700;
    color: #66bb6a;
}
.live-stat-value.gold { color: #ffd54f; }
.live-stat-value.hp-low { color: #ef5350; }
.live-stat-label {
    font-size: 10px;
    color: #78909c;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 2px;
}
.live-hp-bar {
    flex: 1;
    max-width: 220px;
}
.live-hp-bar-inner {
    height: 14px;
    background: #2a3142;
    border-radius: 7px;
    overflow: hidden;
}
.live-hp-fill {
    height: 100%;
    background: linear-gradient(90deg, #4caf50, #66bb6a);
    border-radius: 7px;
    transition: width 0.3s;
}
.live-hp-fill.low { background: linear-gradient(90deg, #f44336, #ef5350); }
.live-hp-fill.mid { background: linear-gradient(90deg, #ff9800, #ffb74d); }
.live-hp-text {
    font-size: 11px;
    color: #90a4ae;
    text-align: center;
    margin-top: 3px;
}
.live-abilities {
    display: flex;
    gap: 6px;
}
.live-ab {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: #2a3142;
    border: 1px solid #3a4558;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
}
.live-ab.level { border-color: #ffd54f; color: #ffd54f; background: rgba(255,213,79,0.1); }
.live-ab .lv { font-size: 10px; color: #78909c; font-weight: 500; }
.live-ab .sym { font-size: 16px; color: #cfd8dc; }
.live-ab.level .sym { color: #ffd54f; }

.live-team-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 4px;
    font-size: 13px;
}
.live-team-row.dead { background: rgba(244,67,54,0.1); opacity: 0.6; }
.live-team-row.alive { background: rgba(76,175,80,0.08); }
.live-team-row .lt-name { flex: 1; font-weight: 600; }
.live-team-row .lt-dead { color: #ef5350; font-size: 11px; font-weight: 700; }
.live-team-row .lt-kda { color: #90a4ae; font-size: 12px; }
.live-team-row .lt-items { display: flex; gap: 2px; }
.live-team-row .lt-item {
    width: 20px; height: 20px;
    border-radius: 3px;
    background: #3a4558;
    border: 1px solid #546e7a;
    font-size: 9px;
    display: flex; align-items: center; justify-content: center;
    color: #cfd8dc;
}
.live-team-row .lt-respawn { color: #ff7043; font-size: 11px; }

.attrs-panel {
    background: #1a2332;
    border-radius: 10px;
    padding: 12px 14px;
    margin-top: 10px;
}
.attrs-toggle {
    cursor: pointer;
    font-size: 12px;
    color: #64b5f6;
    font-weight: 600;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 6px;
}
.attrs-toggle:hover { color: #90caf9; }
.attrs-toggle .arrow { transition: transform 0.2s; }
.attrs-toggle.open .arrow { transform: rotate(90deg); }
/* 外层：四组属性并排（窄屏自动换行）；每组内：一行一个属性 */
.attrs-groups {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px 16px;
    margin-top: 10px;
}
.attrs-groups.hidden { display: none; }
.attrs-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 4px;
    font-size: 12px;
}
.attr-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 3px 8px;
    background: #0f1923;
    border-radius: 4px;
    white-space: nowrap;
}
.attr-row .attr-label { color: #78909c; }
.attr-row .attr-val { color: #e0e0e0; font-weight: 600; }
.attr-row .attr-val.pos { color: #81c784; }
.attr-row .attr-val.gold { color: #ffd54f; }

.team-panel {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 10px;
}
.team-col-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid #37474f;
}
.team-col-title.my { color: #66bb6a; }
.team-col-title.enemy { color: #ef5350; }

.player-card {
    background: #1a2332;
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 6px;
    border-left: 3px solid #546e7a;
}
.player-card.me { border-left-color: #ffd54f; background: #2a2510; }
.player-card.dead { opacity: 0.55; border-left-color: #ef5350; }
.player-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 600;
}
.player-head .name { color: #e0e0e0; }
.player-head .name.me { color: #ffd54f; }
.player-head .champ { color: #90a4ae; font-size: 11px; margin-left: 4px; }
.player-head .lvl { background: #37474f; padding: 1px 6px; border-radius: 10px; font-size: 10px; color: #b0bec5; }
.player-head .dead-tag { color: #ef5350; font-size: 11px; font-weight: 700; }
.player-stats-row {
    display: flex;
    gap: 12px;
    font-size: 11px;
    color: #90a4ae;
    margin-top: 3px;
}
.player-stats-row .kda { color: #e0e0e0; font-weight: 600; }
.player-stats-row .gold-earned { color: #ffd54f; }
.player-stats-row .dmg { color: #ff8a65; }
.player-stats-row .kda-val.good { color: #81c784; }
.player-stats-row .kda-val.mid { color: #ffd54f; }
.player-stats-row .kda-val.bad { color: #ef5350; }
.player-items-row {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    margin-top: 5px;
}
.player-item-chip {
    background: #2a3545;
    border: 1px solid #455a64;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 10px;
    color: #b0bec5;
    max-width: 100px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.player-item-chip.empty {
    background: transparent;
    border: 1px dashed #37474f;
    color: #455a64;
}

.gold-summary {
    background: #1a2332;
    border-radius: 8px;
    padding: 10px 14px;
    margin-top: 10px;
    display: flex;
    justify-content: space-around;
    font-size: 13px;

<script src="/static/coach-card.js"></script>
<script>
let ws = null;
let currentState = null;
let phaseCounts = {};

function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws`);
    ws.onopen = () => console.log('WS connected');
    ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'initial' || msg.type === 'state_update') {
            currentState = msg.data;
            render();
        } else if (msg.type === 'phase_change') {
            currentState = msg.data;
            if (msg.data.phase === 'ChampSelect') resetAIThread();
            render();
        } else if (msg.type === 'dice_rolled') {
            const d = msg.data;
            showDiceToast(d);
        } else if (msg.type === 'level_up') {
            const d = msg.data;
            showLevelUpToast(d);
        }
    };
    ws.onclose = () => {
        setTimeout(connectWS, 2000);
    };
}

function showDiceToast(d) {
    let toast = document.getElementById('dice-toast');
    if (toast) toast.remove();
    toast = document.createElement('div');
    toast.id = 'dice-toast';
    const ca = d.composite || {};
    const score = ca.score || 0;
    const sc = scoreClass(score);
    const breakdown = ca.score_breakdown || {};
    const breakdownHtml = Object.entries(breakdown).map(([k, v]) =>
        `<div class="dt-breakdown"><span>${k}</span><div class="dt-bar"><div class="dt-fill ${scoreClass(v)}" style="width:${v}%"></div></div><span>${Math.round(v)}</span></div>`
    ).join('');
    const v = d.verdict || {};
    const actionText = v.headline ? `${v.headline}：${v.reason || ''}` : (ca.immediate_action || '');
    const newName = d.new_champion_name || '???';
    toast.innerHTML = `
        <div class="dt-header">
            <span class="dt-icon">${d.via === 'reroll' ? '🎲' : '🔁'}</span>
            <span class="dt-title">${d.via === 'reroll' ? '骰子重随！' : '换了英雄'}</span>
            <span class="dt-close">✕</span>
        </div>
        <div class="dt-body">
            <div class="dt-champ">新英雄: <strong>${esc(newName)}</strong></div>
            <div class="dt-score-wrap">
                <div class="dt-score-circle ${sc}">${score}</div>
                <div class="dt-breakdowns">${breakdownHtml}</div>
            </div>
            ${actionText ? `<div class="dt-action">🎯 ${esc(actionText)}</div>` : ''}
            <div class="dt-tip">剩余骰子: ${d.remaining_dice}</div>
        </div>
    `;
    document.body.appendChild(toast);
    setTimeout(() => toast.classList.add('show'), 10);
    toast.querySelector('.dt-close').onclick = () => toast.remove();
    setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 8000);
}

function showLevelUpToast(d) {
    if (!d.augment) return;
    CoachCard.toast(`Lv.${d.new_level}：强化符文三选一，把看到的三个选项填进右下角`);
    AugmentPicker.open();
}

function render() {
    if (!currentState) return;
    const s = currentState;

    const status = document.getElementById('lcu-status');
    const lcuText = document.getElementById('lcu-text');
    if (s.lcu_connected) {
        status.className = 'status-pill status-connected';
        lcuText.textContent = 'LoL 已连接';
    } else {
        status.className = 'status-pill status-waiting';
        lcuText.textContent = '等待 LoL 客户端';
    }

    const phaseLabel = {
        'None': '空闲', 'Lobby': '大厅', 'Matchmaking': '匹配中',
        'ReadyCheck': '准备确认', 'ChampSelect': '选英雄',
        'GameStart': '加载中', 'InProgress': '对局中',
        'Reconnect': '重连中', 'WaitingForStats': '结算',
        'PreEndOfGame': '结算', 'EndOfGame': '已结束'
    };
    document.getElementById('phase-badge').textContent = phaseLabel[s.phase] || s.phase;

    const inGame = ['GameStart', 'InProgress', 'Reconnect'].includes(s.phase);
    let view = null;
    if (s.lcu_connected && s.phase === 'ChampSelect') view = renderChampSelect(s);
    else if (s.lcu_connected && inGame) view = renderInGame(s);

    const main = document.getElementById('main-content');
    const dash = document.getElementById('dash');
    if (view) {
        main.innerHTML = '';
        dash.hidden = false;
        document.getElementById('status-row').innerHTML = view.status || '';
        document.getElementById('col-main').innerHTML = view.main;
        document.getElementById('col-team').innerHTML = view.team;
        document.getElementById('col-guide').innerHTML = view.guide;
    } else {
        dash.hidden = true;
        document.getElementById('status-row').innerHTML = '';
        main.innerHTML = s.lcu_connected
            ? emptyPanel('等待进入大乱斗对局...', '请点击 Play → ARAM 开始匹配')
            : emptyPanel();
    }
    AugmentPicker.showLauncher(s.lcu_connected && inGame);
}

function emptyPanel(title, subtitle) {
    return `<div class="panel">
        <div class="empty-state">
            <div class="icon">🎮</div>
            <p>${title || '等待 LoL 客户端连接'}${subtitle ? '<br>' + subtitle : ''}</p>
        </div>
    </div>`;
}

function renderChampSelect(s) {
    let myHtml = '';
    if (s.my_coach) {
        myHtml = renderCoachCard(s.my_coach, true);
    } else {
        myHtml = `<div class="empty-state"><div class="icon">🎲</div><p>等待随机英雄...</p></div>`;
    }

    const verdictHtml = CoachCard.verdictCard(s);

    let teamAnalysis = '';
    if ((s.my_team && s.my_team.length) || (s.enemy_team && s.enemy_team.length)) {
        teamAnalysis = renderTeamAnalysis(s.my_team || [], s.enemy_team || []);
    }

    return { main: verdictHtml, team: teamAnalysis, guide: myHtml };
}

function renderInGame(s) {
    const live = s.lcd && s.lcd.available;
    const momentHtml = CoachCard.momentCard(s);
    let teamHtml = '';
    if (s.lcd && s.lcd.available) {
        teamHtml = renderLiveTeamPanel(s.lcd);
    }
    let eventHtml = '';
    if (s.lcd && s.lcd.available && s.lcd.events && s.lcd.events.length) {
        eventHtml = renderEventStream(s.lcd.events);
    }
    let coachHtml = '';
    if (s.my_coach) {
        coachHtml = renderCoachCard(s.my_coach, true);
    } else {
        coachHtml = `<div class="empty-state"><div class="icon">⚔️</div><p>对局中...<br>英雄数据加载中</p></div>`;
    }
    return {
        status: live ? renderStatusBar(s.lcd) : '',
        main: momentHtml + (live ? renderAttrsPanel(s.lcd) : ''),
        team: teamHtml + eventHtml,
        guide: coachHtml,
    };
}

// 页面每 2 秒整块重绘，展开状态要单独记住，否则一刷新就收回去；也存进浏览器，下次打开保持
let attrsOpen = false;
try { attrsOpen = localStorage.getItem('attrsOpen') === '1'; } catch (e) { /* 隐私模式等读不了就默认收起 */ }

function toggleAttrs(el) {
    attrsOpen = !attrsOpen;
    try { localStorage.setItem('attrsOpen', attrsOpen ? '1' : '0'); } catch (e) { /* 存不了也不影响本次 */ }
    document.getElementById('attrsBody').classList.toggle('hidden', !attrsOpen);
    el.classList.toggle('open', attrsOpen);
    el.lastChild.textContent = ` 📊 属性面板（点击${attrsOpen ? '收起' : '展开'}）`;
}

function renderStatusBar(lcd) {
    const a = lcd.active || {};
    const st = a.champion_stats || {};
    const gold = Math.round(a.gold || 0);
    const level = a.level || 1;
    const hp = Math.round(st.hp || 0);
    const maxHp = Math.round(st.max_hp || 1);
    const hpPct = st.hp_pct || (maxHp > 0 ? Math.max(0, Math.min(100, (hp / maxHp) * 100)) : 0);
    const hpClass = hpPct < 25 ? 'low' : hpPct < 50 ? 'mid' : '';
    const abilities = a.abilities || {};
    const gameTime = lcd.game_time || 0;
    const gMin = Math.floor(gameTime / 60);
    const gSec = Math.floor(gameTime % 60);

    const abSymbols = { Q: 'Q', W: 'W', E: 'E', R: 'R', Passive: '被动' };
    const abOrder = ['Q', 'W', 'E', 'R'];
    const abHtml = abOrder.map(k => {
        const ab = abilities[k] || {};
        const lv = ab.level;
        const cls = lv ? 'level' : '';
        return `<div class="live-ab ${cls}"><span class="sym">${abSymbols[k]}</span>${lv ? `<span class="lv">Lv${lv}</span>` : ''}</div>`;
    }).join('');

    return `<div class="live-status-bar">
        <div class="live-stat">
            <div class="live-stat-value gold">${gold}</div>
            <div class="live-stat-label">金币</div>
        </div>
        <div class="live-stat">
            <div class="live-stat-value">Lv${level}</div>
            <div class="live-stat-label">等级</div>
        </div>
        <div class="live-stat">
            <div class="live-stat-value">${gMin}:${String(gSec).padStart(2,'0')}</div>
            <div class="live-stat-label">游戏时间</div>
        </div>
        <div class="live-hp-bar">
            <div class="live-hp-bar-inner">
                <div class="live-hp-fill ${hpClass}" style="width:${hpPct}%;"></div>
            </div>
            <div class="live-hp-text">HP ${hp} / ${maxHp} (${Math.round(hpPct)}%)</div>
        </div>
        <div class="live-abilities">${abHtml}</div>
    </div>`;
}

function renderAttrsPanel(lcd) {
    const st = (lcd.active || {}).champion_stats || {};

    const maxHp = Math.round(st.max_hp || 1);
    const attrsHtml = attrGroupsHtml(st, hp, maxHp);
    return `<div class="attrs-panel">
        <div class="attrs-toggle ${attrsOpen ? 'open' : ''}" onclick="toggleAttrs(this)">
            <span class="arrow">▶</span> 📊 属性面板（点击${attrsOpen ? '收起' : '展开'}）
        </div>
        <div id="attrsBody" class="attrs-groups ${attrsOpen ? '' : 'hidden'}">${attrsHtml}</div>
    </div>`;

function renderLiveTeamPanel(lcd) {
    // 按 is_me 判断我方，找不到自己时退回 ORDER（与后端 resolve_my_enemy_teams 一致）
    const tm = lcd.team_map || {};
    const iAmChaos = (tm['CHAOS'] || []).some(p => p.is_me);
    const myList = (iAmChaos ? tm['CHAOS'] : tm['ORDER']) || [];
    const enemyList = (iAmChaos ? tm['ORDER'] : tm['CHAOS']) || [];

    function kdaRatio(k, d, a) {
        if (!k && !a) return 0;
        return d > 0 ? ((k + a) / d).toFixed(2) : ((k + a) * 1.0).toFixed(2);
    }
    function kdaClass(ratio) {
        if (ratio >= 4) return 'good';
        if (ratio >= 2) return 'mid';
        return 'bad';
    }

    function renderPlayerCard(p, isMine) {
        const dead = p.is_dead;
        const ratio = kdaRatio(p.kills || 0, p.deaths || 0, p.assists || 0);
        const itemsHtml = [];
        for (let i = 0; i < 6; i++) {
            const it = (p.items || [])[i];
            if (it && it.name) {
                itemsHtml.push(`<div class="player-item-chip" title="${esc(it.name)} (${Number(it.price) || 0}G)">${esc(it.name)}</div>`);
            } else {
                itemsHtml.push(`<div class="player-item-chip empty" title="空">·</div>`);
            }
        }

        // LCD 只提供 KDA/补刀/视野分/装备；当前金币只有自己的，别人的经济是后端估算的
        const itemGold = p.item_gold || 0;
        const estGold = p.est_gold || 0;
        const cs = p.cs || 0;
        const wardScore = p.ward_score || 0;

        return `<div class="player-card ${dead ? 'dead' : ''} ${p.is_me ? 'me' : ''}">
            <div class="player-head">
                <span>
                    <span class="name ${p.is_me ? 'me' : ''}">${esc(p.name)}</span>
                    <span class="champ">${esc(p.champion)}</span>
                    <span class="lvl">Lv${p.level || 1}</span>
                </span>
                ${dead ? `<span class="dead-tag">💀 ${p.respawn_timer || 0}s</span>` : ''}
            </div>
            <div class="player-stats-row">
                <span class="kda">KDA <span class="kda-val ${kdaClass(ratio)}">${p.kills || 0}/${p.deaths || 0}/${p.assists || 0}</span> <span style="color:#b0bec5;">(${ratio})</span></span>
            </div>
            <div class="player-stats-row">
                <span class="gold-earned">💰 ${p.is_me ? '' : '≈'}${estGold}G · 装备 ${itemGold}G${p.is_me && p.gold != null ? ` · 现金 ${Math.round(p.gold)}G` : ''}</span>
            </div>
            ${(cs > 0 || wardScore > 0) ? `<div class="player-stats-row">
                ${cs > 0 ? `<span>🌾 ${cs}补刀</span>` : ''}
                ${wardScore > 0 ? `<span>👁️ 视野 ${wardScore}</span>` : ''}
            </div>` : ''}
            <div class="player-items-row">${itemsHtml.join('')}</div>
        </div>`;
    }

    function renderCol(list, isMine) {
        const totalGold = list.reduce((s, p) => s + (p.est_gold || 0), 0);
        const totalKills = list.reduce((s, p) => s + (p.kills || 0), 0);
        const totalDeaths = list.reduce((s, p) => s + (p.deaths || 0), 0);
        const totalCs = list.reduce((s, p) => s + (p.cs || 0), 0);
        const aliveCount = list.filter(p => !p.is_dead).length;
        return `<div>
            <div class="team-col-title ${isMine ? 'my' : 'enemy'}">${isMine ? '🟢 我方' : '🔴 敌方'} · ${aliveCount}/5 存活</div>
            ${list.map(p => renderPlayerCard(p, isMine)).join('')}
            <div style="margin-top:6px;padding:6px 10px;background:#0f1923;border-radius:6px;font-size:11px;color:#78909c;">
                总计: KDA ${totalKills}/${totalDeaths}/${list.reduce((s,p)=>s+(p.assists||0),0)} · 💰≈${totalGold}G · 🌾${totalCs}
            </div>
        </div>`;
    }

    // 按估算经济比：大乱斗只能阵亡时买装备，装备总价会低估阵亡少（通常是优势）的一方
    const sum = (list, key) => list.reduce((s, p) => s + (p[key] || 0), 0);
    const myTotalGold = sum(myList, 'est_gold');
    const enemyTotalGold = sum(enemyList, 'est_gold');
    const goldDiff = myTotalGold - enemyTotalGold;
    const diffAbs = Math.abs(goldDiff);
    const itemDiff = sum(myList, 'item_gold') - sum(enemyList, 'item_gold');

    return `<div class="panel">
        <h2>👥 实时对局状态</h2>
        <div class="gold-summary">
            <div class="gs-item">
                <div class="gs-val" style="color:#66bb6a;">${myTotalGold}G</div>
                <div class="gs-label">我方经济（估算）</div>
            </div>
            <div class="gs-item ${goldDiff >= 0 ? 'diff-pos' : 'diff-neg'}">
                <div class="gs-val">${goldDiff >= 0 ? '+' : '-'}${diffAbs}G</div>
                <div class="gs-label" title="按人头/助攻/补刀估算，用你自己的真实金币校准；装备总价不含身上没花的钱">经济差 · 装备差 ${itemDiff >= 0 ? '+' : '-'}${Math.abs(itemDiff)}G</div>
            </div>
            <div class="gs-item">
                <div class="gs-val" style="color:#ef5350;">${enemyTotalGold}G</div>
                <div class="gs-label">敌方经济（估算）</div>
            </div>
        </div>
        <div class="team-panel">
            ${renderCol(myList, true)}
            ${renderCol(enemyList, false)}
        </div>
    </div>`;
}

// LCD 里不带人名的事件；没列出的事件名原样显示
const EVENT_LABELS = {
    GameStart: '🎮 对局开始',
    MinionsSpawning: '🌊 小兵出发',
    InhibRespawningSoon: '💎 水晶即将重生',
    InhibRespawned: '💎 水晶已重生',
    GameEnd: '🏁 对局结束',
};

function renderEventStream(events) {
    const recent = events.slice(-12);
    const html = recent.map(e => {
        const name = e.EventName || '';
        const t = Math.floor((e.EventTime || 0) / 60) + ':' + String(Math.floor((e.EventTime || 0) % 60)).padStart(2, '0');
        let cls = '';
        let text = '';
        if (name === 'ChampionKill') {
            cls = 'ekill';
            const killer = e.KillerName || '';
            const victim = e.VictimName || '';
            text = `💀 ${esc(killer)} 击杀了 ${esc(victim)}`;
        } else if (name === 'Multikill') {
            cls = 'ekill';
            text = `🔥 ${esc(e.KillerName)} 连杀 ${Number(e.KillStreak) || ''}`;
        } else if (name === 'TurretKilled') {
            cls = 'eturret';
            text = `🏰 防御塔被摧毁`;
        } else if (name === 'InhibKilled') {
            cls = 'einhib';
            text = `💎 水晶被摧毁`;
        } else if (name === 'DragonKill') {
            cls = 'edragon';
            text = `🐉 ${esc(e.KillerName)} 击杀龙`;
        } else if (name === 'BaronKill') {
            cls = 'ebaron';
            text = `👑 ${esc(e.KillerName)} 击杀男爵`;
        } else if (name === 'HeraldKill') {
            cls = 'edragon';
            text = `🦅 ${esc(e.KillerName)} 击杀峡谷先锋`;
        } else if (name === 'FirstBlood') {
            cls = 'ekill';
            text = `🩸 ${esc(e.Recipient)} 拿下一血`;
        } else if (name === 'FirstBrick') {
            cls = 'eturret';
            text = `🏰 ${esc(e.KillerName)} 拿下首座防御塔`;
        } else if (name === 'Ace') {
            cls = 'ekill';
            text = `💥 ${esc(e.Acer)} 完成团灭`;
        } else if (EVENT_LABELS[name]) {
            text = EVENT_LABELS[name];
        } else {
            text = esc(name);
        }
        return `<div class="event-item ${cls}"><span style="color:#546e7a;margin-right:6px;">${t}</span>${text}</div>`;
    }).join('');

    return `<div class="panel">
        <h2>📜 实时事件</h2>
        <div class="event-stream">${html}</div>
    </div>`;
}

function scoreClass(score) {
    if (score >= 65) return 'high';
    if (score >= 45) return 'mid';
    return 'low';
}

// champions.json 里 situational 的字段名 → 显示用的标签
const SITUATION_LABELS = {
    need_ad: '对面 AD 多', need_ap: 'AP', heavy_ap: '对面 AP 多', against_ap: '对面 AP 多',
    need_survive: '保命', against_tank: '打坦克', all_tank: '对面全是肉', need_tank: '补肉',
    against_heal: '对面回复多', enemy_heal: '对面回复多', against_assassin: '防刺客',
    need_armor_pen: '破甲', need_range: '射程', need_ap_dmg: 'AP 伤害',
};

function renderCoachCard(coach, isMine) {
    const runeDetails = (coach.primary_details || []).map(r => `<span class="rune-chip">${esc(r)}</span>`).join('');
    const buildHtml = (coach.build || []).map((item, i, arr) => {
        if (i === arr.length - 1) return `<span class="build-item">${esc(item)}</span>`;
        return `<span class="build-item">${esc(item)}</span><span class="build-arrow">→</span>`;
    }).join('');

    let situationalHtml = '';
    if (coach.situational && Object.keys(coach.situational).length > 0) {
        situationalHtml = '<div class="section"><div class="section-title">⚠️ 应对场景</div>' +
            Object.entries(coach.situational).map(([k, v]) =>
                `<div class="situational-item">${SITUATION_LABELS[k] ? `<strong>${SITUATION_LABELS[k]}</strong>` : ''}${esc(v)}</div>`
            ).join('') + '</div>';
    }

    const tipsHtml = (coach.tips || []).map(t => `<li>${esc(t)}</li>`).join('');

    const pct = v => `${((v || 0) * 100).toFixed(1)}%`;
    const opgg = coach.opgg;
    const opggHtml = opgg
        ? `<div style="font-size:12px;color:#90a4ae;margin-top:6px;">OP.GG 大乱斗 T${esc(opgg.tier)} · 胜率 ${pct(opgg.win_rate)} · 选取率 ${pct(opgg.pick_rate)}${opgg.version ? ` · ${esc(opgg.version)}` : ''}</div>`
        : '';
    const balanceHtml = coach.aram_balance_text
        ? `<div style="font-size:12px;color:#ffb74d;margin-top:4px;">⚖️ 大乱斗平衡：${esc(coach.aram_balance_text)}</div>`
        : '';
    const sourceTag = coach.data_source === 'opgg'
        ? '<span style="font-size:11px;color:#66bb6a;margin-left:6px;">出装/符文来自 OP.GG 统计</span>'
        : '';
    const shardsHtml = (coach.rune_shards || []).length
        ? `<div style="margin-top:6px;font-size:12px;color:#90a4ae;">属性碎片：${esc(coach.rune_shards.join(' · '))}</div>`
        : '';
    const extraBuildHtml = [
        (coach.starter_items || []).length ? `出门装：${esc(coach.starter_items.join(' + '))}` : '',
        (coach.spells || []).length ? `召唤师技能：${esc(coach.spells.join(' + '))}` : '',
    ].filter(Boolean).map(t => `<div style="margin-top:6px;font-size:12px;color:#90a4ae;">${t}</div>`).join('');

    return `
        <div id="coach-card">
            <div class="champion-card">
                <div class="champion-header ${isMine ? 'my-card' : ''}">
                    <span class="champion-name">${esc(coach.name)}</span>
                    <span class="champion-role">${esc(coach.role)}</span>
                    ${coach.core_cost ? `<span style="margin-left:auto;font-size:12px;color:#78909c;">核心总价 ${coach.core_cost}G</span>` : ''}
                </div>
                ${opggHtml}
                ${balanceHtml}

                <div class="section">
                    <div class="section-title">✨ 符文${sourceTag}</div>
                    <div style="margin-bottom:4px;">
                        <span class="rune-box rune-primary">主系 · ${esc(coach.primary_branch)} · ${esc(coach.primary_rune)}</span>
                    </div>
                    <div class="rune-details">${runeDetails}</div>
                    <div style="margin-top:8px;">
                        <span class="rune-box rune-secondary">副系 · ${esc(coach.secondary_branch)} · ${esc(coach.secondary_rune)}</span>
                    </div>
                    ${shardsHtml}

function renderTeamAnalysis(myTeam, enemyTeam) {
    function countRoles(team) {
        const counts = { '坦克': 0, '法师': 0, '射手': 0, '刺客': 0, '战士': 0, '辅助': 0, '未知': 0 };
        const names = [];
        team.forEach(c => {
            if (c.coach) {
                counts[c.coach.role] = (counts[c.coach.role] || 0) + 1;
                names.push(c.champion_name || c.coach.name);
            }
        });
        return { counts, names };
    }

    const my = countRoles(myTeam);
    const enemy = countRoles(enemyTeam);

    function roleRow(counts, key) {
        const c = counts[key] || 0;
        if (c === 0) return '';
        return `<div class="team-role"><span class="role-name">${key}</span><span class="role-count">${c}</span></div>`;
    }

    let balanceHint = '';
    if (myTeam.length > 0 && enemyTeam.length > 0) {
        const myRoles = Object.entries(my.counts).filter(([k,v]) => v > 0);
        const enemyRoles = Object.entries(enemy.counts).filter(([k,v]) => v > 0);
        const myMage = (my.counts['法师'] || 0) + (my.counts['刺客'] || 0);
        const myTank = my.counts['坦克'] || 0;
        const myFrontline = myTank + (my.counts['战士'] || 0);
        const hasFrontline = myFrontline >= 1;
        const hasAp = myMage >= 1;
        if (!hasFrontline) {
            balanceHint = '<span class="balance-badge balance-minus">⚠️ 缺前排</span>';
        } else if (!hasAp) {
            balanceHint = '<span class="balance-badge balance-plus">⚠️ 缺AP</span>';
        } else {
            balanceHint = '<span class="balance-badge balance-even">✅ 阵容均衡</span>';
        }
    }

    return `
        <div class="panel">
            <h2>⚖️ 阵容对比 ${balanceHint}</h2>
            <div class="team-section">
                <div class="team-card team-ally">
                    <div class="team-title">🟢 我方阵容</div>
                    ${['坦克','战士','法师','射手','刺客','辅助'].map(r => roleRow(my.counts, r)).join('')}
                    ${my.names.length ? '<div style="margin-top:10px;font-size:11px;color:#78909c;">' + esc(my.names.join(', ')) + '</div>' : ''}
                </div>
                <div class="team-card team-enemy">
                    <div class="team-title">🔴 敌方阵容</div>
                    ${enemyTeam.length ? ['坦克','战士','法师','射手','刺客','辅助'].map(r => roleRow(enemy.counts, r)).join('')
                        : '<div style="font-size:12px;color:#607d8b;padding:8px 0;">大乱斗选人阶段看不到敌方，进对局后显示</div>'}
                    ${enemy.names.length ? '<div style="margin-top:10px;font-size:11px;color:#78909c;">' + esc(enemy.names.join(', ')) + '</div>' : ''}
                </div>
            </div>
        </div>`;
}

// ---------------------------------------------------------------- AI 输出（SSE 流式）
// 服务端事件：start {mode, model} → thinking（推理模型在思考）→ delta {text}… → done；出错 error {text}

function renderLite(text) {
    return esc(text).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}

// fetch + ReadableStream 读 SSE（EventSource 不支持 POST）
async function readSSE(url, body, onEvent, signal) {
    const resp = await fetch(url, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {}), signal,
    });
    if (!resp.ok) throw new Error(`请求失败 (${resp.status})`);
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
            const line = buf.slice(0, i).split('\n').find(l => l.startsWith('data:'));
            buf = buf.slice(i + 2);
            if (line) onEvent(JSON.parse(line.slice(5)));
        }
    }
}

// 把一次输出渲染到 el：思考中计时，正文边到边显示。返回 { handle(ev), text(), meta }
function streamView(el) {
    let text = '', timer = null, started = Date.now();
    const meta = {};
    const thinking = () => {
        const sec = Math.round((Date.now() - started) / 1000);
        el.innerHTML = `<span class="ai-thinking">🤔 思考中 ${sec}s…</span>`;
    };
    const stop = () => { if (timer) { clearInterval(timer); timer = null; } };
    return {
        meta,
        text: () => text,
        handle(ev) {
            if (ev.type === 'start') { Object.assign(meta, ev); el.innerHTML = '<span class="ai-thinking">⏳ 连接中…</span>'; }
            else if (ev.type === 'thinking') { started = Date.now(); thinking(); timer = setInterval(thinking, 1000); }
            else if (ev.type === 'delta') { stop(); text += ev.text; el.innerHTML = renderLite(text); el.classList.add('loading'); }
            else if (ev.type === 'error') { stop(); text += (text ? '\n\n' : '') + ev.text; el.innerHTML = renderLite(text); meta.error = true; }
            else if (ev.type === 'done') { stop(); }
            const box = el.closest('.ai-scroll') || el;
            box.scrollTop = box.scrollHeight;
        },
        finish() { stop(); el.classList.remove('loading'); },
    };
}

let deepAbort = null;

// 深度分析（整局报告）：配置了 LLM Key 走 LLM（流式），否则走本地规则引擎
async function runDeepAnalysis() {
    const out = document.getElementById('deepReport');
    const btn = document.getElementById('deepBtn');
    const metaEl = document.getElementById('deepMeta');
    if (deepAbort) deepAbort.abort();
    deepAbort = new AbortController();
    out.style.display = 'block';
    btn.disabled = true;
    metaEl.textContent = '生成中…';
    const view = streamView(out);
    try {
        await readSSE('/api/ai/deep', {}, ev => view.handle(ev), deepAbort.signal);
        const m = view.meta;
        metaEl.textContent = `${m.mode === 'llm' ? `🤖 LLM ${m.model || ''}` : '⚡ 本地规则引擎（未配置 LLM Key）'} · ${new Date().toLocaleTimeString()}`;
    } catch (e) {
        if (e.name !== 'AbortError') { out.textContent = `❌ 出错了: ${e.message}`; metaEl.textContent = ''; }
    } finally {
        view.finish();
        btn.disabled = false;
        btn.textContent = '重新生成';
        deepAbort = null;
    }
}

// 问 AI：本局的问答串，追问时带上最近几轮
let aiHistory = [];

function resetAIThread() {
    if (aiAbort) aiAbort.abort();
    aiHistory = [];
    const thread = document.getElementById('aiThread');
    if (thread) thread.innerHTML = '';
}

async function askAICoach(question) {
    question = (question || '').trim();
    if (!question) return;
    const thread = document.getElementById('aiThread');
    const sendBtn = document.getElementById('aiSendBtn');
    const input = document.getElementById('aiInput');
    if (aiAbort) aiAbort.abort();
    const controller = new AbortController();
    aiAbort = controller;

    const turn = document.createElement('div');
    turn.className = 'ai-turn';
    turn.innerHTML = `<div class="ai-q"></div><div class="ai-answer loading"></div>`;
    turn.firstChild.textContent = `🙋 ${question}`;
    thread.appendChild(turn);
    const view = streamView(turn.lastChild);
    input.value = '';
    sendBtn.disabled = true;
    try {
        await readSSE('/api/ai/ask', { question, history: aiHistory.slice(-4) }, ev => view.handle(ev), controller.signal);
        if (!view.meta.error && view.text()) aiHistory.push({ q: question, a: view.text() });
    } catch (e) {
        turn.lastChild.textContent = e.name === 'AbortError' ? '（已中断）' : `❌ 出错了: ${e.message}`;
    } finally {
        view.finish();
        sendBtn.disabled = false;
        input.focus();
        if (aiAbort === controller) aiAbort = null;
    }
}

}

async function openMdViewer() {
    const overlay = document.createElement("div");
    overlay.className = "md-viewer-overlay";
    overlay.innerHTML = `
        <div class="md-viewer">
            <div class="md-viewer-header">
                <h3>📝 对局数据 Markdown</h3>
                <button class="md-close" onclick="this.closest('.md-viewer-overlay').remove()">✕</button>
            </div>
            <div class="md-viewer-body" id="mdBody">加载中...</div>
            <div class="md-viewer-footer">
                <button onclick="location.reload()">🔄 刷新</button>
                <button class="md-copy-btn" onclick="copyMd()">📋 复制全部</button>
            </div>
        </div>`;
    document.body.appendChild(overlay);

    try {
        const resp = await fetch("/api/coach/md");
        const data = await resp.json();
        const body = overlay.querySelector("#mdBody");
        if (data.exists && data.content) {
            body.textContent = data.content;
            body.dataset.raw = data.content;
        } else {
            body.textContent = "暂无对局数据，请先进入对局。";
        }
    } catch (e) {
        overlay.querySelector("#mdBody").textContent = "❌ 加载失败: " + e.message;
    }
}

function copyMd() {
    const body = document.querySelector(".md-viewer-body");
    if (!body || !body.dataset.raw) return;
    navigator.clipboard.writeText(body.dataset.raw).then(() => {
        const btn = document.querySelector(".md-copy-btn");
        const old = btn.textContent;
        btn.textContent = "✅ 已复制!";
        setTimeout(() => btn.textContent = old, 1500);
    });
}
